# ============================================
# SGLE Backend - Docker Profile Configuration
# ============================================

spring.application.name=sgle
server.port=8081

# PostgreSQL Database (production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sgle_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sgle_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sgle_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Console disabled
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:MyMemoSecretKey2026VeryLongSecretKeyForJWTTokenGeneration1234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Logging
logging.level.root=INFO
logging.level.sn.gtech.sgle=INFO
logging.level.org.hibernate.SQL=WARN
