version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: sgle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgle_db
      POSTGRES_USER: sgle_user
      POSTGRES_PASSWORD: sgle_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sgle-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgle_user -d sgle_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # pgAdmin - Database Management UI
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgle-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sgle.sn
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sgle-network
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # SGLE Backend Application
  # ============================================
  sgle-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgle-backend
    restart: unless-stopped
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sgle_db
      SPRING_DATASOURCE_USERNAME: sgle_user
      SPRING_DATASOURCE_PASSWORD: sgle_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      
      # JPA Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_SHOW_SQL: "false"
      
      # H2 Console disabled in production
      SPRING_H2_CONSOLE_ENABLED: "false"
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-MyMemoSecretKey2026VeryLongSecretKeyForJWTTokenGeneration1234567890}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
      
      # Spring Profile
      SPRING_PROFILES_ACTIVE: docker
      
      # Actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    ports:
      - "8081:8081"
    networks:
      - sgle-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================
# Networks
# ============================================
networks:
  sgle-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
